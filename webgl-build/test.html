<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Game Chat Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', monospace;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #top-bar {
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      padding: 10px 20px;
      font-size: 11px;
      color: #555;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #game-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #2a2a2a;
    }

    #game-label {
      padding: 8px 16px;
      font-size: 10px;
      color: #444;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 1px solid #1e1e1e;
    }

    #unity-container {
      flex: 1;
      background: #000;
      position: relative;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #loading-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    #loading-text {
      font-size: 11px;
      color: #444;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    #progress-bar-bg {
      width: 200px;
      height: 2px;
      background: #1e1e1e;
    }

    #progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #00ff88;
      transition: width 0.2s ease;
    }

    #chat-panel {
      width: 340px;
      display: flex;
      flex-direction: column;
      background: #111;
    }

    #chat-label {
      padding: 8px 16px;
      font-size: 10px;
      color: #444;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 1px solid #1e1e1e;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.5;
      max-width: 90%;
      word-break: break-word;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.sent {
      background: #1a3a2a;
      border-left: 2px solid #00ff88;
      color: #ccffdd;
      align-self: flex-end;
    }

    .message.blocked {
      background: #2a1a1a;
      border-left: 2px solid #ff4444;
      color: #ffcccc;
      align-self: flex-end;
      text-decoration: line-through;
      opacity: 0.6;
    }

    .message.system {
      background: #1a1a2a;
      border-left: 2px solid #4466ff;
      color: #aabbff;
      font-size: 11px;
      letter-spacing: 1px;
    }

    #status-bar {
      padding: 8px 16px;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-top: 1px solid #1e1e1e;
      border-bottom: 1px solid #1e1e1e;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #444;
      transition: background 0.3s;
    }

    #status-dot.idle    { background: #444; }
    #status-dot.playing { background: #ffaa00; animation: pulse 1s infinite; }
    #status-dot.win     { background: #00ff88; }
    #status-dot.lose    { background: #ff4444; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    #status-text { color: #444; }

    #input-row {
      display: flex;
      border-top: 1px solid #1e1e1e;
    }

    #chat-input {
      flex: 1;
      background: #0f0f0f;
      border: none;
      outline: none;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      padding: 14px 16px;
    }

    #chat-input::placeholder { color: #333; }
    #chat-input:disabled { opacity: 0.4; }

    #send-btn {
      background: #0f0f0f;
      border: none;
      border-left: 1px solid #1e1e1e;
      color: #00ff88;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 14px 20px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    #send-btn:hover:not(:disabled) { background: #00ff8811; }
    #send-btn:disabled { color: #333; cursor: not-allowed; }
  </style>
</head>
<body>

<div id="top-bar">chat-app-ttpr — integration test</div>

<div id="main">

  <div id="game-panel">
    <div id="game-label">Unity Game</div>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
      <div id="loading-overlay">
        <div id="loading-text">Loading game...</div>
        <div id="progress-bar-bg">
          <div id="progress-bar-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="chat-panel">
    <div id="chat-label">Chat</div>

    <div id="messages">
      <div class="message system">Type a message and hit Send to start the game. Message only delivers if you win.</div>
    </div>

    <div id="status-bar">
      <div id="status-dot" class="idle"></div>
      <span id="status-text">Waiting</span>
    </div>

    <div id="input-row">
      <input id="chat-input" type="text" placeholder="Type your message..." />
      <button id="send-btn">Send</button>
    </div>
  </div>

</div>

<script>
  let pendingMessage = null;
  let gameInProgress = false;

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('chat-input');
  const sendBtn    = document.getElementById('send-btn');
  const statusDot  = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');

  function setStatus(state, label) {
    statusDot.className = state;
    statusText.textContent = label;
  }

  function addMessage(text, type) {
    const div = document.createElement('div');
    div.className = 'message ' + type;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setInputLocked(locked) {
    inputEl.disabled = locked;
    sendBtn.disabled = locked;
  }

  function handleSend() {
    const text = inputEl.value.trim();
    if (!text || gameInProgress) return;

    pendingMessage = text;
    gameInProgress = true;
    inputEl.value  = '';

    setInputLocked(true);
    setStatus('playing', 'Game in progress...');
    addMessage('[ Game started — deliver the message! ]', 'system');
  }

  sendBtn.addEventListener('click', handleSend);
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') handleSend(); });

  // Unity calls this when game ends
  window.onGameResult = function(isWin) {
    gameInProgress = false;

    if (isWin) {
      setStatus('win', 'Message delivered!');
      addMessage(pendingMessage, 'sent');
      addMessage('[ WIN — message sent ]', 'system');
    } else {
      setStatus('lose', 'Blocked');
      addMessage(pendingMessage, 'blocked');
      addMessage('[ LOSE — message blocked ]', 'system');
    }

    pendingMessage = null;
    setInputLocked(false);
    setTimeout(() => setStatus('idle', 'Waiting'), 3000);
  };

  // Unity WebGL loader
  const buildUrl  = 'Build';
  const loaderUrl = buildUrl + '/webgl-build.loader.js';

  const config = {
   dataUrl:      buildUrl + '/webgl-build.data',
frameworkUrl: buildUrl + '/webgl-build.framework.js',
codeUrl:      buildUrl + '/webgl-build.wasm',
    streamingAssetsUrl: 'StreamingAssets',
    companyName:        'DefaultCompany',
    productName:        'Runner',
    productVersion:     '1.0',
  };

  const canvas  = document.getElementById('unity-canvas');
  const overlay = document.getElementById('loading-overlay');
  const fill    = document.getElementById('progress-bar-fill');

  const script  = document.createElement('script');
  script.src    = loaderUrl;
  script.onload = () => {
    createUnityInstance(canvas, config, progress => {
      fill.style.width = (progress * 100) + '%';
    }).then(instance => {
      overlay.style.display = 'none';
      window.unityInstance  = instance;
    }).catch(err => {
      document.getElementById('loading-text').textContent = 'Error: ' + err;
    });
  };
  document.body.appendChild(script);
</script>

</body>
</html>
